[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "norma43"
version = "0.1.0"
description = "A Python library to parse Norma 43 banking files (Spanish standard)."
authors = [
    {name = "Enrico Pesce", email = "enrico.pesce@example.com"},
]
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.7"

[project.urls]
"Homepage" = "https://github.com/enricopesce/norma43"
"Bug Tracker" = "https://github.com/enricopesce/norma43/issues"
